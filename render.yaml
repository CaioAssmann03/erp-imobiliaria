databases:
  - name: erp-imobiliaria-db
    plan: free
    databaseName: erp_imobiliaria
    user: erp_imobiliaria

envVarGroups:
  - name: erp-imobiliaria-shared
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: POSTGRES_DB
        fromDatabase:
          name: erp-imobiliaria-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: erp-imobiliaria-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: erp-imobiliaria-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: erp-imobiliaria-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: erp-imobiliaria-db
          property: port
      - key: REDIS_URL
        fromService:
          name: erp-imobiliaria-redis
          type: redis
          property: connectionString

services:
  # Only reachable from other services in this Blueprint's private network.
  - type: redis
    name: erp-imobiliaria-redis
    plan: free
    ipAllowList: []

  - type: web
    name: erp-imobiliaria-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/schema/
    preDeployCommand: python manage.py migrate
    envVarGroups:
      - erp-imobiliaria-shared
    envVars:
      - key: ALLOWED_HOSTS
        value: erp-imobiliaria-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://erp-imobiliaria-frontend.onrender.com
      # Fill in after the Santander credentialing step (see architecture doc).
      - key: SANTANDER_CLIENT_ID
        sync: false
      - key: SANTANDER_CLIENT_SECRET
        sync: false
      - key: SANTANDER_CERT_PATH
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: worker
    name: erp-imobiliaria-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker --loglevel=info
    plan: free
    envVarGroups:
      - erp-imobiliaria-shared

  - type: worker
    name: erp-imobiliaria-celery-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config beat --loglevel=info
    plan: free
    envVarGroups:
      - erp-imobiliaria-shared

  - type: web
    name: erp-imobiliaria-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://erp-imobiliaria-backend.onrender.com
