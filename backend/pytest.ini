[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Defaults for running against the compose database from the host; real environment values win (D:).
env =
    D:POSTGRES_DB=erp_imobiliaria
    D:POSTGRES_HOST=localhost
    # Test-only Fernet key for the gateway credentials (spec 030): never use it outside tests.
    D:GATEWAY_CREDENTIALS_KEY=5LxWzvItsDUx0RjoF_A4iuAkcPCq5AvSBDjeetppuaA=
    # Test-only Ed25519 key (spec 022): never use it outside tests.
    D:JWT_SIGNING_KEY=-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIPgNc4Fe8BDipzi1QlwfpVP8iIyGPH1Mx9AUw9UaXYvD\n-----END PRIVATE KEY-----
# Only these two known, harmless warnings are silenced; any other warning still shows up.
filterwarnings =
    # WhiteNoise: STATIC_ROOT does not exist until `collectstatic` runs (never needed in tests).
    ignore:No directory at.*staticfiles:UserWarning
    # django-unfold 0.108 (latest) overrides get_action_choices() with the old signature; upstream fix pending for Django 7.0.
    ignore:Overriding get_action_choices:django.utils.deprecation.RemovedInDjango70Warning
