[mypy]
python_version = 3.12
strict = True
plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main
exclude = (venv|migrations)/
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-unfold.*]
ignore_missing_imports = True

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-drf_spectacular.*]
ignore_missing_imports = True

# unfold and django-filter ship no types: subclassing their classes (admin, FilterSet) is expected.
[mypy-apps.*.admin]
disallow_subclassing_any = False

[mypy-apps.core.infrastructure.admin_base]
disallow_subclassing_any = False

[mypy-apps.persons.filters]
disallow_subclassing_any = False

[mypy-apps.finance.filters]
disallow_subclassing_any = False

[mypy-apps.condominiums.filters]
disallow_subclassing_any = False

[mypy-apps.billing.filters]
disallow_subclassing_any = False

[mypy-auditlog.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True
