# Production stack of the ERP. Runs next to air-app-node without sharing anything but the
# external "erp_edge" network, which the Caddy of air-app-node joins to reach the frontend.
name: erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./app/backend
    image: erp-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - '8000'
    # /api/health/ answers before the host check and the HTTPS redirect (spec 008); the image has no curl.
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  celery_worker:
    image: erp-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker --loglevel=info
    depends_on:
      - backend

  celery_beat:
    image: erp-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat --loglevel=info
    depends_on:
      - backend

  frontend:
    build:
      context: ./app/frontend
      target: production
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: '3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - edge
    expose:
      - '3000'

networks:
  edge:
    external: true
    name: erp_edge

volumes:
  erp_postgres_data:
