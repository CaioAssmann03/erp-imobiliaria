services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_imobiliaria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host side of the mapping: set POSTGRES_HOST_PORT in .env when 5432 is taken by another Postgres.
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    # Not published on the host: only the other containers use it (a Redis of another project often holds 6379).

  # S3-compatible storage for development (PDFs of the boletos and receipts), in place of the Cloudflare R2 bucket of
  # production. It creates the bucket by itself and accepts any key; MinIO no longer publishes images on Docker Hub.
  s3:
    image: adobe/s3mock:5
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${AWS_STORAGE_BUCKET_NAME:-erp-dev}
    ports:
      - "9090:9090"

  backend:
    build: ./backend
    # Built once here; the Celery services run the same image.
    image: erp-imobiliaria-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Local file storage (PDFs of the boletos and receipts): the `s3` service below; the defaults are for development only.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-erp-dev}
      # host.docker.internal reaches the s3 service from the container and, on Docker Desktop, from the browser (signed URLs).
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://host.docker.internal:9090}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - redis

  celery_worker:
    image: erp-imobiliaria-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # Local file storage (PDFs of the boletos and receipts): the `s3` service below; the defaults are for development only.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dev}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-erp-dev}
      # host.docker.internal reaches the s3 service from the container and, on Docker Desktop, from the browser (signed URLs).
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://host.docker.internal:9090}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: celery -A config worker --loglevel=info
    depends_on:
      - db
      - redis

  celery_beat:
    image: erp-imobiliaria-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A config beat --loglevel=info
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # O navegador só fala com o Next (mesma origem); o servidor do Next chama o Django por aqui
      # (dentro do container, "localhost" não é o backend). Variável só do servidor.
      API_INTERNAL_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      GOOGLE_MAPS_EMBED_KEY: ${GOOGLE_MAPS_EMBED_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
