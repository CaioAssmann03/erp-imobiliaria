services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_imobiliaria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host side of the mapping: set POSTGRES_HOST_PORT in .env when 5432 is taken by another Postgres.
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  # S3-compatible storage for development, in place of the Cloudflare R2 bucket of production.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Creates the bucket once and exits.
  minio_setup:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-erp-dev}"

  backend:
    build: ./backend
    # Built once here; the Celery services run the same image.
    image: erp-imobiliaria-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Local file storage (PDFs of the boletos and receipts): the MinIO below; the defaults are for development only.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-erp-dev}
      # host.docker.internal reaches MinIO from the container and, on Docker Desktop, from the browser (signed URLs).
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - redis

  celery_worker:
    image: erp-imobiliaria-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # Local file storage (PDFs of the boletos and receipts): the MinIO below; the defaults are for development only.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-erp-dev}
      # host.docker.internal reaches MinIO from the container and, on Docker Desktop, from the browser (signed URLs).
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: celery -A config worker --loglevel=info
    depends_on:
      - db
      - redis

  celery_beat:
    image: erp-imobiliaria-backend
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A config beat --loglevel=info
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # O navegador só fala com o Next (mesma origem); o servidor do Next chama o Django por aqui
      # (dentro do container, "localhost" não é o backend). Variável só do servidor.
      API_INTERNAL_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      GOOGLE_MAPS_EMBED_KEY: ${GOOGLE_MAPS_EMBED_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
