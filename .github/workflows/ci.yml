name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_imobiliaria
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      INTERNAL_API_KEY: ci-internal-api-key-not-for-production-0123456789
      # Test-only Ed25519 key, the same as pytest.ini (spec 022).
      JWT_SIGNING_KEY: '-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIPgNc4Fe8BDipzi1QlwfpVP8iIyGPH1Mx9AUw9UaXYvD\n-----END PRIVATE KEY-----'
      # Test-only Fernet key, the same as pytest.ini (spec 030).
      GATEWAY_CREDENTIALS_KEY: 5LxWzvItsDUx0RjoF_A4iuAkcPCq5AvSBDjeetppuaA=
      DEBUG: "false"
      POSTGRES_DB: erp_imobiliaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Check docs (headers, links, roadmap and spec statuses)
        run: python backend/docs/tools/check_docs.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install system libraries (WeasyPrint renders the boleto PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Known vulnerabilities in the pinned dependencies (spec 065): a new advisory fails the build until the pin is raised.
      - name: Audit dependencies (pip-audit)
        working-directory: backend
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Type check (mypy)
        working-directory: backend
        run: mypy apps config

      - name: Run tests
        working-directory: backend
        run: pytest apps -q

      # The nightly backup (spec 040): retention, failures and a real pg_dump / openssl / pg_restore round trip.
      - name: Backup tests
        working-directory: backend
        run: python -m unittest discover -s backup/tests -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Version from "packageManager" in frontend/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # High and critical advisories fail the build (spec 065); transitive fixes go in `overrides` of pnpm-workspace.yaml.
      - name: Audit dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        working-directory: frontend
        run: pnpm lint --max-warnings=0

      - name: Unit tests
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
