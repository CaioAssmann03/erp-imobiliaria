# Monthly update PRs (spec 065). Security fixes do not wait for the month: they come from Dependabot security updates, and the CI
# blocks on a known vulnerability (pip-audit, pnpm audit).
# pip and npm: every minor and patch update of the month is ONE grouped PR (so packages that must move together, such as boto3 and
# botocore, do); a major update still gets its own PR, because it needs a deliberate review.
# Docker: the base images are not bumped automatically across a Python minor or a Node major, because the CI does not build them; they
# are changed by hand, about once a year, to a stable release (the tags float within their version, so patches arrive on rebuild).
# GitHub Actions: all updates of the month in one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
